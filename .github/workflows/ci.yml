name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: find src tests -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - run: npx playwright install --with-deps chromium
      - run: npm run seeds:validate
      - run: npm test
