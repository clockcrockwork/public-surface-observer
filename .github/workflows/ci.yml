name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: find src tests -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - run: npx playwright install --with-deps chromium
      - run: npm run seeds:validate
      - run: npm test
      - name: Resolve and verify current workflow lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh extension install github/gh-actions-lock --pin v0.4.1
          CHECKOUT_DIR="$RUNNER_TEMP/public-surface-observer"
          gh repo clone "$GITHUB_REPOSITORY" "$CHECKOUT_DIR" -- --branch "$GITHUB_HEAD_REF" --single-branch
          cd "$CHECKOUT_DIR"
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/ci.yml?ref=main" --jq .content | base64 --decode > .github/workflows/ci.yml
          gh actions-lock --no-narrow
          gh actions-lock --verify
          echo "Generated lockfile for the integrated main workflows:"
          cat .github/workflows/actions.lock
