name: Verify workflow lockfile

on:
  pull_request:
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install gh-actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.4.1

      - name: Resolve and verify pull request lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CHECKOUT_DIR="$RUNNER_TEMP/public-surface-observer"
          gh repo clone "$GITHUB_REPOSITORY" "$CHECKOUT_DIR" -- --branch "$GITHUB_HEAD_REF" --single-branch
          cd "$CHECKOUT_DIR"
          gh actions-lock --no-narrow
          gh actions-lock --verify
          echo "Resolved and online-verified workflow dependency lock:"
          cat .github/workflows/actions.lock
